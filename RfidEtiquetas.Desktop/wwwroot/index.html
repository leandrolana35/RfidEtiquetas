<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AFIXPrint Desktop</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <style>
        :root { --afix: #0d5bab; }
        body { background: #f5f6f8; }
        .afix-topbar { background: var(--afix); color: #fff; }
        .afix-topbar .bi { opacity: .9; }

</head>
<body>
    <div id="app">
        <div style="padding:2rem;font-family:sans-serif;color:#666">Carregando AFIXPrint…</div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;width:100%;background:#b00020;color:#fff;padding:.6rem 1rem">
        Ocorreu um erro inesperado.
        <a href="" class="reload" style="color:#fff;text-decoration:underline">Recarregar</a>
    </div>

    <script src="_framework/blazor.webview.js"></script>

</html>
